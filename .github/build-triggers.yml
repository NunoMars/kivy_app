# Configuration des déclenchements conditionnels pour les workflows
# Ce fichier définit quels changements de fichiers déclenchent quels types de builds

# Fichiers qui déclenchent un test build (rapide)
test_build_paths:
  - "*.py"
  - "*.kv"
  - "requirements.txt"
  - "buildozer.spec"
  - ".github/workflows/test-build.yml"

# Fichiers qui déclenchent une build complète Android
full_build_paths:
  - "*.py"
  - "*.kv"
  - "requirements.txt"
  - "buildozer.spec"
  - "tarot_img/**"
  - ".github/workflows/build-p4a.yml"

# Fichiers qui ne déclenchent AUCUNE build automatique
ignore_paths:
  - "README.md"
  - "*.md"
  - "docs/**"
  - "guides/**"
  - "*.txt"  # Sauf requirements.txt qui est dans les include
  - ".gitignore"
  - ".vscode/**"
  - "__pycache__/**"

# Branches autorisées pour les builds automatiques
allowed_branches:
  - "main"
  - "master"
  - "develop"

# Configuration des releases
release_triggers:
  - "release"  # Déclenche uniquement sur les releases publiées
  
# Notes :
# - Les workflows test-build.yml et build-p4a.yml utilisent maintenant paths: pour filtrer
# - Le workflow deploy-release.yml ne se déclenche que sur les releases
# - Les builds manuelles (workflow_dispatch) restent toujours disponibles
# - Cette configuration évite les builds inutiles sur des changements de doc/guides
