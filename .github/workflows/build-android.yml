name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  workflow_dispatch:

jobs:
  setup-env:
    runs-on: ubuntu-latest
    outputs:
      keystore_available: ${{ steps.check-keystore.outputs.available }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git zip unzip libbz2-dev libsqlite3-dev libssl-dev \
            libffi-dev libncurses5-dev libgdbm-dev autotools-dev automake autoconf \
            libtool pkg-config zlib1g-dev libltdl-dev python3-setuptools python3-wheel \
            gcc-multilib g++-multilib

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer==1.5.0
          pip install --user -r requirements.txt
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Android environment
        run: |
          export SDK_PATH=/usr/local/lib/android/sdk
          export NDK_PATH=$SDK_PATH/ndk/25.2.9519653

          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV

          sudo mkdir -p $SDK_PATH/tools/bin
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/sdkmanager $SDK_PATH/tools/bin/sdkmanager
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/avdmanager $SDK_PATH/tools/bin/avdmanager

          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
          $SDK_PATH/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "platforms;android-33" \
            "build-tools;34.0.0" "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Decode keystore (if available)
        id: check-keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > signing.keystore
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

  build-apk:
    needs: setup-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore environment
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer==1.5.0
          pip install --user -r requirements.txt

      - name: Restore Android environment  
        run: |
          export SDK_PATH=/usr/local/lib/android/sdk
          export NDK_PATH=$SDK_PATH/ndk/25.2.9519653
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV

      - name: Clean previous APK build
        run: |
          buildozer android clean || true
          rm -rf bin/ .buildozer/android/platform/build-*

      - name: Build APK (debug)
        run: |
          buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: |
            bin/*.apk
            .buildozer/**/*.apk
          retention-days: 30

  build-aab:
    needs: setup-env
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore environment
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer==1.5.0
          pip install --user -r requirements.txt

      - name: Restore Android environment
        run: |
          export SDK_PATH=/usr/local/lib/android/sdk
          export NDK_PATH=$SDK_PATH/ndk/25.2.9519653
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV

      - name: Decode keystore (for AAB)
        if: ${{ needs.setup-env.outputs.keystore_available == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > signing.keystore

      - name: Prepare buildozer.spec
        run: |
          sed -i "s|^#*android.release_artifact *=.*|android.release_artifact = aab|" buildozer.spec
          grep -q "android.archs" buildozer.spec || echo "android.archs = arm64-v8a" >> buildozer.spec

          if [ "${{ needs.setup-env.outputs.keystore_available }}" == "true" ]; then
            sed -i "s|^#*android.release_keystore *=.*|android.release_keystore = %(source.dir)s/signing.keystore|" buildozer.spec
            sed -i "s|^#*android.release_key *=.*|android.release_key = ${{ secrets.ANDROID_KEY_ALIAS }}|" buildozer.spec
            sed -i "s|^#*android.release_key_passwd *=.*|android.release_key_passwd = ${{ secrets.ANDROID_KEY_PASSWORD }}|" buildozer.spec
            sed -i "s|^#*android.release_keystore_passwd *=.*|android.release_keystore_passwd = ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}|" buildozer.spec
          fi

      - name: Clean AAB build
        run: |
          buildozer android clean || true
          rm -rf .buildozer/android/platform/build-*

      - name: Build AAB (release)
        run: |
          timeout 2400 buildozer android release --verbose || {
            echo "⚠️ First AAB build failed, retrying with clean"
            buildozer android clean
            timeout 2400 buildozer android release --verbose || echo "❌ Second attempt failed"
          }

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: |
            bin/*.aab
            .buildozer/**/*.aab
          retention-days: 90

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            aab_build*.log
            .buildozer/**/*.log
          retention-days: 7
