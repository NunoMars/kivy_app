name: Build Android APK & AAB (Optimized)

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  JAVA_VERSION: '17'
  CYTHON_VERSION: '3.0.10'
  BUILDOZER_VERSION: '1.5.0'
  ANDROID_API_LEVEL: '34'
  NDK_VERSION: '26.3.11579264'
  BUILD_TOOLS_VERSION: '34.0.0'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: ['apk', 'aab']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Cache amélioré pour les dépendances Python
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
            ~/.local/bin
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}-${{ env.CYTHON_VERSION }}-${{ env.BUILDOZER_VERSION }}-v4
          restore-keys: |
            ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}-
            ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-

      # Cache Buildozer global optimisé
      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
          key: ${{ runner.os }}-buildozer-${{ env.ANDROID_API_LEVEL }}-${{ env.NDK_VERSION }}-${{ env.BUILD_TOOLS_VERSION }}-v4
          restore-keys: |
            ${{ runner.os }}-buildozer-${{ env.ANDROID_API_LEVEL }}-${{ env.NDK_VERSION }}-
            ${{ runner.os }}-buildozer-${{ env.ANDROID_API_LEVEL }}-

      # Cache Android SDK/NDK optimisé (profite du cache setup-android)
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.android/ndk
          key: ${{ runner.os }}-android-setup-${{ env.ANDROID_API_LEVEL }}-${{ env.NDK_VERSION }}-${{ env.BUILD_TOOLS_VERSION }}-v4
          restore-keys: |
            ${{ runner.os }}-android-setup-${{ env.ANDROID_API_LEVEL }}-${{ env.NDK_VERSION }}-
            ${{ runner.os }}-android-setup-${{ env.ANDROID_API_LEVEL }}-

      # Cache P4A plus granulaire
      - name: Cache python-for-android
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/python-for-android
            .buildozer/android/platform/python-for-android
          key: ${{ runner.os }}-p4a-${{ hashFiles('requirements.txt') }}-${{ env.PYTHON_VERSION }}-${{ env.ANDROID_API_LEVEL }}-v3
          restore-keys: |
            ${{ runner.os }}-p4a-${{ hashFiles('requirements.txt') }}-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-p4a-${{ hashFiles('requirements.txt') }}-

      # Cache des packages de dépendances
      - name: Cache buildozer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            .buildozer/android/platform/build-*/packages
          key: ${{ runner.os }}-buildozer-packages-${{ env.ANDROID_API_LEVEL }}-v2
          restore-keys: |
            ${{ runner.os }}-buildozer-packages-${{ env.ANDROID_API_LEVEL }}-
            ${{ runner.os }}-buildozer-packages-

      # Cache des sources compilées
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android/platform/build-*
            .buildozer/android/dists
          key: ${{ runner.os }}-build-${{ matrix.build_type }}-${{ hashFiles('**/*.py', '**/*.kv', 'requirements.txt', 'buildozer.spec') }}-v2
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.build_type }}-
            ${{ runner.os }}-build-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            python3-pip python3-setuptools python3-wheel python3-dev \
            libffi-dev libssl-dev zlib1g-dev libbz2-dev libsqlite3-dev \
            libncurses5-dev libgdbm-dev liblzma-dev tk-dev \
            autotools-dev automake autoconf libtool pkg-config \
            ccache \
            cmake ninja-build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.BUILD_TOOLS_VERSION }} ndk;${{ env.NDK_VERSION }} cmake;${{ env.CMAKE_VERSION }} extras;android;m2repository extras;google;m2repository'

      - name: Configure Android environment
        run: |
          # Variables d'environnement Android
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          
          # Configuration des outils
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # Préparer les répertoires buildozer
          mkdir -p ~/.buildozer/android/platform
          
          # Copier le SDK avec structure complète
          if [ ! -d ~/.buildozer/android/platform/android-sdk ]; then
            echo "📁 Copying Android SDK to buildozer location..."
            cp -r $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          fi
          
          # Créer la structure des outils pour compatibilité buildozer
          echo "🔧 Creating tools compatibility structure..."
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # Créer les liens symboliques vers les nouveaux outils
          if [ -d ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ]; then
            # Lien vers sdkmanager
            ln -sf ../../cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
            # Lien vers avdmanager
            ln -sf ../../cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager || true
            echo "✅ Tools symlinks created successfully"
          else
            echo "⚠️ cmdline-tools not found, trying alternative approach"
            # Alternative: copier directement depuis ANDROID_HOME
            if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
              ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager || true
              echo "✅ Direct tools symlinks created"
            fi
          fi
          
          # Vérifier que sdkmanager est accessible
          if [ -x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager ]; then
            echo "✅ sdkmanager is accessible at ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          else
            echo "⚠️ sdkmanager still not accessible, buildozer may fail"
          fi

      - name: Fix sdkmanager paths
        run: |
          echo "🔧 Fixing sdkmanager paths for buildozer compatibility"
          
          # S'assurer que la structure tools/bin existe toujours
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # Forcer la création des liens même si ils existent déjà
          echo "🔗 Creating/updating sdkmanager symlinks..."
          
          # Supprimer les anciens liens s'ils existent
          rm -f ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          rm -f ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          
          # Créer les nouveaux liens
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
            echo "✅ Symlinks created successfully"
          else
            echo "❌ Source sdkmanager not found"
          fi
          
          # Test final
          if [ -x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager ]; then
            echo "✅ sdkmanager is now accessible"
            echo "Version: $(~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version 2>/dev/null || echo 'Error checking version')"
          else
            echo "❌ sdkmanager still not accessible"
            echo "🔍 Debugging info:"
            echo "  ANDROID_HOME: $ANDROID_HOME"
            echo "  Expected source: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            echo "  Expected target: ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
            ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" 2>/dev/null || echo "  cmdline-tools not found"
          fi
          
          # Copier le NDK avec tous les noms possibles
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          if [ -d "$NDK_PATH" ]; then
            echo "📁 Copying Android NDK to buildozer location..."
            # Format principal attendu par buildozer
            if [ ! -d ~/.buildozer/android/platform/android-ndk-r${{ env.NDK_VERSION }} ]; then
              cp -r "$NDK_PATH" ~/.buildozer/android/platform/android-ndk-r${{ env.NDK_VERSION }}
            fi
            # Format court (version recommandée 26c pour NDK 26.3.11579264)
            if [ ! -d ~/.buildozer/android/platform/android-ndk-r26c ]; then
              cp -r "$NDK_PATH" ~/.buildozer/android/platform/android-ndk-r26c
            fi
            echo "✅ NDK copied successfully"
          else
            echo "❌ NDK not found at $NDK_PATH"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Installation avec cache et optimisations
          pip install --user --no-warn-script-location \
            cython==${{ env.CYTHON_VERSION }} \
            buildozer==${{ env.BUILDOZER_VERSION }}
          
          # Installation des dépendances du projet
          if [ -f requirements.txt ]; then
            pip install --user --no-warn-script-location -r requirements.txt
          fi
          
          # Dépendances P4A communes
          pip install --user --no-warn-script-location \
            python-for-android \
            colorama \
            appdirs \
            jinja2 \
            sh \
            pyjnius \
            plyer
          
          # Ajouter ~/.local/bin au PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Vérification
          echo "=== Installed packages ==="
          pip list --user | grep -E "(cython|buildozer|python-for-android)"

      - name: Decode keystore
        id: keystore
        if: matrix.build_type == 'aab'
        run: |
          if [ -n "${{ secrets.ANDROID_SIGNING_KEY }}" ]; then
            echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > signing.keystore
            echo "available=true" >> $GITHUB_OUTPUT
            echo "🔑 Keystore decoded successfully"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ No keystore available - building unsigned AAB"
          fi

      - name: Configure buildozer.spec
        run: |
          echo "=== Configuring buildozer.spec for ${{ matrix.build_type }} ==="
          
          # Sauvegarde
          cp buildozer.spec buildozer.spec.backup
          
          # Supprimer toutes les anciennes configurations Android pour éviter les doublons
          echo "🧹 Cleaning existing Android configurations..."
          sed -i '/^android\.archs\s*=/d' buildozer.spec
          sed -i '/^android\.api\s*=/d' buildozer.spec  
          sed -i '/^android\.ndk\s*=/d' buildozer.spec
          sed -i '/^android\.sdk\s*=/d' buildozer.spec
          sed -i '/^android\.release_artifact\s*=/d' buildozer.spec
          sed -i '/^android\.release_keystore\s*=/d' buildozer.spec
          sed -i '/^android\.release_keyalias\s*=/d' buildozer.spec
          sed -i '/^android\.release_keystore_passwd\s*=/d' buildozer.spec
          sed -i '/^android\.release_keyalias_passwd\s*=/d' buildozer.spec
          
          # Supprimer aussi les anciennes lignes de configuration automatique
          sed -i '/^# === CONFIGURATION AUTOMATIQUE/d' buildozer.spec
          sed -i '/^# === AJOUTS AUTOMATIQUES/d' buildozer.spec
          
          # Ajouter les nouvelles configurations
          echo "📝 Adding new Android configurations..."
          
          # Insérer avant la section [buildozer]
          sed -i '/^\[buildozer\]$/i\\n# === CONFIGURATION AUTOMATIQUE PAR LE WORKFLOW CI/CD ===' buildozer.spec
          sed -i '/^# === CONFIGURATION AUTOMATIQUE/a android.archs = arm64-v8a, armeabi-v7a' buildozer.spec
          sed -i '/^android.archs = /a android.api = ${{ env.ANDROID_API_LEVEL }}' buildozer.spec
          sed -i '/^android.api = /a android.ndk = ${{ env.NDK_VERSION }}' buildozer.spec
          sed -i '/^android.ndk = /a android.sdk = ${{ env.ANDROID_API_LEVEL }}' buildozer.spec
          
          # Forcer l'utilisation du NDK pré-installé 
          sed -i '/^android.sdk = /a android.ndk_path = ~/.buildozer/android/platform/android-ndk-r${{ env.NDK_VERSION }}' buildozer.spec
          sed -i '/^android.ndk_path = /a android.sdk_path = ~/.buildozer/android/platform/android-sdk' buildozer.spec
          
          # Configuration spécifique au type de build
          if [ "${{ matrix.build_type }}" == "aab" ]; then
            echo "📦 Configuring for AAB build"
            sed -i '/^android.sdk_path = /a android.release_artifact = aab' buildozer.spec
            
            # Configuration keystore si disponible
            if [ "${{ steps.keystore.outputs.available }}" == "true" ]; then
              echo "🔑 Configuring release signing"
              sed -i '/^android.release_artifact = aab/a android.release_keystore = %(source.dir)s/signing.keystore' buildozer.spec
              sed -i '/^android.release_keystore = /a android.release_keyalias = ${{ secrets.KEY_ALIAS }}' buildozer.spec
              sed -i '/^android.release_keyalias = /a android.release_keystore_passwd = ${{ secrets.KEYSTORE_PASSWORD }}' buildozer.spec
              sed -i '/^android.release_keystore_passwd = /a android.release_keyalias_passwd = ${{ secrets.KEY_PASSWORD }}' buildozer.spec
            fi
          else
            echo "📱 Configuring for APK build"
            sed -i '/^android.sdk_path = /a android.release_artifact = apk' buildozer.spec
          fi
          
          echo "=== buildozer.spec configured ==="
          echo "📋 Final configuration preview:"
          grep -A 15 "CONFIGURATION AUTOMATIQUE" buildozer.spec || echo "Configuration added successfully"

      - name: Optimize cache
        run: |
          echo "🧹 Optimizing buildozer cache"
          chmod +x scripts/optimize-cache.sh
          ./scripts/optimize-cache.sh

      - name: Pre-download dependencies
        run: |
          echo "📦 Pre-downloading common build dependencies"
          
          # Utiliser le script de téléchargement alternatif
          chmod +x scripts/download-dependencies.sh
          ./scripts/download-dependencies.sh
          
          # Vérifier le résultat
          echo "📊 Final cache status:"
          ls -lah ~/.buildozer/android/packages/ 2>/dev/null || echo "No packages cached"
          
          # Calculer la taille totale du cache
          if [ -d ~/.buildozer/android/packages/ ]; then
            cache_size=$(du -sh ~/.buildozer/android/packages/ 2>/dev/null | cut -f1)
            echo "Total cache size: $cache_size"
            
            # Compter les fichiers
            file_count=$(ls -1 ~/.buildozer/android/packages/ 2>/dev/null | wc -l)
            echo "Cached files: $file_count"
          fi

      - name: Pre-build setup
        run: |
          echo "🔧 Pre-build setup for ${{ matrix.build_type }}"
          
          # Créer les répertoires nécessaires
          mkdir -p .buildozer/android/platform
          mkdir -p bin
          
          # Vérifier que le NDK/SDK sont disponibles
          echo "=== Android SDK/NDK verification ==="
          echo "Android Home: $ANDROID_HOME"
          echo "Android SDK: $(ls -la $ANDROID_HOME 2>/dev/null || echo 'Not found')"
          echo "Android NDK: $(ls -la $ANDROID_HOME/ndk/${{ env.NDK_VERSION }} 2>/dev/null || echo 'Not found')"
          
          # Vérifier les copies dans buildozer
          echo "Buildozer SDK: $(ls -la ~/.buildozer/android/platform/android-sdk 2>/dev/null || echo 'Not found')"
          echo "Buildozer NDK directories:"
          ls -la ~/.buildozer/android/platform/android-ndk* 2>/dev/null || echo 'No NDK directories found'
          
          # Vérifier les outils critiques
          echo "=== Critical tools verification ==="
          TOOLS_CHECK=(
            "~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            "$ANDROID_HOME/platform-tools/adb"
          )
          
          for tool in "${TOOLS_CHECK[@]}"; do
            if [ -x "$(eval echo $tool)" ]; then
              echo "✅ $tool"
            else
              echo "❌ $tool"
            fi
          done
          
          # Lister tous les NDK disponibles
          echo "Available NDK versions:"
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo 'No NDK directory found'
          
          # Taille des répertoires
          echo "Directory sizes:"
          echo "SDK size: $(du -sh ~/.buildozer/android/platform/android-sdk 2>/dev/null || echo '0B')"
          echo "NDK size: $(du -sh ~/.buildozer/android/platform/android-ndk-r* 2>/dev/null || echo '0B')"
          
          # Vérifier les caches
          echo "=== Cache status ==="
          echo "Buildozer cache: $(du -sh ~/.buildozer 2>/dev/null || echo '0B')"
          echo "P4A cache: $(du -sh ~/.cache/python-for-android 2>/dev/null || echo '0B')"
          echo "Android SDK: $(du -sh $ANDROID_HOME 2>/dev/null || echo '0B')"

      - name: Diagnostic réseau avant build
        run: |
          bash scripts/diagnose-network.sh
          
          # Test de connectivité HTTP/HTTPS plus robuste que ping
          echo "🔍 Test de connectivité critique pour le build..."
          
          # Vérifier les URLs critiques pour buildozer
          CRITICAL_URLS=(
            "https://github.com"
            "https://download.savannah.gnu.org"
            "https://pypi.org"
          )
          
          failed_urls=0
          for url in "${CRITICAL_URLS[@]}"; do
            if ! curl -s --connect-timeout 10 --max-time 20 "$url" >/dev/null 2>&1; then
              echo "❌ Cannot reach $url"
              failed_urls=$((failed_urls + 1))
            else
              echo "✅ $url accessible"
            fi
          done
          
          # Si plus de la moitié des URLs critiques échouent, annuler le build
          if [ $failed_urls -gt 1 ]; then
            echo "::error::Connectivité réseau insuffisante ($failed_urls/3 URLs critiques inaccessibles) - Build annulé."
            echo "::error::Réessayez plus tard quand la connectivité sera rétablie."
            exit 1
          elif [ $failed_urls -gt 0 ]; then
            echo "::warning::Connectivité réseau dégradée ($failed_urls/3 URLs critiques inaccessibles) - Build tenté avec retry."
          else
            echo "✅ Connectivité réseau correcte - Build lancé."
          fi

      - name: Build ${{ matrix.build_type }}
        timeout-minutes: 120
        env:
          BUILDOZER_LOG_LEVEL: 2
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/signing.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          JAVA_OPTS: "-Xmx4g"
          # Variables pour améliorer la connectivité réseau
          PYTHONHTTPSVERIFY: "0"
          REQUESTS_CA_BUNDLE: ""
          CURL_CA_BUNDLE: ""
        run: |
          echo "🚀 Building ${{ matrix.build_type }}"
          
          # Afficher l'environnement
          echo "=== Environment ==="
          echo "Python: $(python --version)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Buildozer: $(buildozer version)"
          echo "Android Home: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_HOME"
          echo "Available space: $(df -h . | tail -1)"
          
          # Fonction de retry pour les builds
          build_with_retry() {
            local max_attempts=3
            local attempt=1
            local delay=30
            
            while [ $attempt -le $max_attempts ]; do
              echo "🔄 Build attempt $attempt/$max_attempts"
              
              if [ "${{ matrix.build_type }}" == "aab" ]; then
                echo "📦 Building AAB (release)"
                if timeout 90m buildozer android release; then
                  echo "✅ Build completed successfully on attempt $attempt"
                  return 0
                fi
              else
                echo "📱 Building APK (debug)"
                if timeout 90m buildozer android debug; then
                  echo "✅ Build completed successfully on attempt $attempt"
                  return 0
                fi
              fi
              
              echo "❌ Build attempt $attempt failed"
              
              if [ $attempt -lt $max_attempts ]; then
                echo "⏳ Waiting ${delay}s before retry..."
                sleep $delay
                
                # Nettoyer les téléchargements partiels
                echo "🧹 Cleaning partial downloads..."
                find ~/.buildozer -name "*.tmp" -delete 2>/dev/null || true
                find .buildozer -name "*.tmp" -delete 2>/dev/null || true
                
                # Augmenter le délai pour le prochain essai
                delay=$((delay * 2))
              fi
              
              attempt=$((attempt + 1))
            done
            
            echo "❌ All build attempts failed"
            return 1
          }
          
          # Exécuter le build avec retry
          if build_with_retry; then
            echo "✅ Build completed successfully"
          else
            echo "❌ Build failed after all retry attempts"
            echo ""
            echo "🔍 Diagnostic post-échec:"
            echo "========================"
            
            # Diagnostic réseau
            echo "📡 Network diagnostics:"
            ping -c 3 8.8.8.8 >/dev/null 2>&1 && echo "  ✅ Internet OK" || echo "  ❌ No internet"
            ping -c 3 download.savannah.gnu.org >/dev/null 2>&1 && echo "  ✅ Download server OK" || echo "  ❌ Cannot reach download server"
            
            # Diagnostic des caches
            echo ""
            echo "� Cache diagnostics:"
            echo "  ~/.buildozer size: $(du -sh ~/.buildozer 2>/dev/null || echo '0B')"
            echo "  ~/.cache/python-for-android size: $(du -sh ~/.cache/python-for-android 2>/dev/null || echo '0B')"
            echo "  ~/.buildozer/android/packages size: $(du -sh ~/.buildozer/android/packages 2>/dev/null || echo '0B')"
            
            # Diagnostic des artefacts
            echo ""
            echo "📋 Build artifacts:"
            echo "  bin/ directory: $(ls -la bin/ 2>/dev/null || echo 'Does not exist')"
            echo "  .buildozer/android/platform/build-* packages:"
            find .buildozer/android/platform/build-* -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.zip" 2>/dev/null | head -10 || echo "  No build packages found"
            
            # Diagnostic des erreurs buildozer
            echo ""
            echo "📝 Recent buildozer logs:"
            if [ -f ".buildozer/logs/buildozer.log" ]; then
              echo "  Last 20 lines of buildozer.log:"
              tail -20 .buildozer/logs/buildozer.log || echo "  Cannot read buildozer.log"
            else
              echo "  No buildozer.log found"
            fi
            
            # Diagnostic des erreurs p4a
            if [ -d ".buildozer/android/platform/python-for-android" ]; then
              echo ""
              echo "📝 Python-for-Android diagnostics:"
              p4a_log=$(find .buildozer/android/platform/python-for-android -name "*.log" | head -1)
              if [ -f "$p4a_log" ]; then
                echo "  Last 20 lines of P4A log:"
                tail -20 "$p4a_log" || echo "  Cannot read P4A log"
              else
                echo "  No P4A log found"
              fi
            fi
            
            # Diagnostic des téléchargements
            echo ""
            echo "📥 Download diagnostics:"
            echo "  Cached packages:"
            ls -la ~/.buildozer/android/packages/ 2>/dev/null || echo "  No packages cached"
            
            echo "  Recent download attempts:"
            find ~/.buildozer -name "*.tmp" -o -name "*.part" 2>/dev/null | head -5 || echo "  No partial downloads found"
            
            exit 1
          fi

      - name: Verify build artifacts
        run: |
          echo "=== Build verification ==="
          
          # Lister les fichiers générés
          echo "Generated files:"
          find . -name "*.${{ matrix.build_type }}" -type f -exec ls -lh {} \; || echo "No ${{ matrix.build_type }} files found"
          
          # Vérifier la signature pour AAB
          if [ "${{ matrix.build_type }}" == "aab" ] && [ "${{ steps.keystore.outputs.available }}" == "true" ]; then
            AAB_FILE=$(find . -name "*.aab" -type f | head -1)
            if [ -n "$AAB_FILE" ]; then
              echo "=== AAB signature verification ==="
              if command -v jarsigner >/dev/null 2>&1; then
                jarsigner -verify -verbose "$AAB_FILE" || echo "⚠️ Signature verification failed"
              else
                echo "ℹ️ jarsigner not available for signature verification"
              fi
            fi
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.build_type }}-${{ github.run_number }}
          path: bin/*.${{ matrix.build_type }}
          retention-days: ${{ matrix.build_type == 'aab' && 90 || 30 }}

      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.build_type }}-${{ github.run_number }}
          path: |
            .buildozer/**/*.log
            buildozer.spec.backup
            buildozer.spec
          retention-days: 7

  # Notification et résumé
  notify-results:
    needs: build-android
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Build summary
        run: |
          echo "=== Build Summary ==="
          
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ All builds completed successfully!"
            echo ""
            echo "📱 APK Build: SUCCESS"
            echo "📦 AAB Build: SUCCESS"
            echo ""
            echo "Next steps:"
            echo "1. Download artifacts from Actions tab"
            echo "2. Test APK on device"
            echo "3. Upload AAB to Google Play Console"
          else
            echo "❌ Build failed - check logs for details"
            echo "💡 Common solutions:"
            echo "  - Clear caches and retry"
            echo "  - Check buildozer.spec configuration"
            echo "  - Verify requirements.txt dependencies"
          fi