name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  workflow_dispatch:

jobs:
  setup-env:
    runs-on: ubuntu-latest
    outputs:
      keystore_available: ${{ steps.check-keystore.outputs.available }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git zip unzip libbz2-dev libsqlite3-dev libssl-dev \
            libffi-dev libncurses5-dev libgdbm-dev autotools-dev automake autoconf \
            libtool pkg-config zlib1g-dev libltdl-dev python3-setuptools python3-wheel \
            gcc-multilib g++-multilib

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer==1.5.0
          pip install --user -r requirements.txt
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Android environment
        run: |
          export SDK_PATH=/usr/local/lib/android/sdk
          export NDK_PATH=$SDK_PATH/ndk/25.2.9519653

          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV

          sudo mkdir -p $SDK_PATH/tools/bin
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/sdkmanager $SDK_PATH/tools/bin/sdkmanager
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/avdmanager $SDK_PATH/tools/bin/avdmanager

          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
          $SDK_PATH/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "platforms;android-33" \
            "build-tools;34.0.0" "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Decode keystore (if available)
        id: check-keystore
        run: |
          if [ -n "${{ secrets.ANDROID_SIGNING_KEY }}" ]; then
            echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > signing.keystore
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

  build-apk:
    needs: setup-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git zip unzip libbz2-dev libsqlite3-dev libssl-dev \
            libffi-dev libncurses5-dev libgdbm-dev autotools-dev automake autoconf \
            libtool pkg-config zlib1g-dev libltdl-dev python3-setuptools python3-wheel \
            gcc-multilib g++-multilib

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer==1.5.0
          pip install --user -r requirements.txt
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Android environment
        run: |
          export SDK_PATH=/usr/local/lib/android/sdk
          export NDK_PATH=$SDK_PATH/ndk/25.2.9519653

          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV

          sudo mkdir -p $SDK_PATH/tools/bin
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/sdkmanager $SDK_PATH/tools/bin/sdkmanager
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/avdmanager $SDK_PATH/tools/bin/avdmanager

          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
          $SDK_PATH/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "platforms;android-33" \
            "build-tools;34.0.0" "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Clean previous APK build
        run: |
          buildozer android clean || true
          rm -rf bin/ .buildozer/android/platform/build-*

      - name: Build APK (debug)
        run: |
          export BUILDOZER_LOG_LEVEL=2
          buildozer android debug --verbose

      - name: List APK outputs
        if: always()
        run: |
          echo "=== Directory contents after APK build ==="
          ls -la
          echo "=== bin directory contents ==="
          ls -la bin/ || echo "No bin directory found"
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: |
            bin/*.apk
          retention-days: 30
          if-no-files-found: warn

  build-aab:
    needs: setup-env
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git zip unzip libbz2-dev libsqlite3-dev libssl-dev \
            libffi-dev libncurses5-dev libgdbm-dev autotools-dev automake autoconf \
            libtool pkg-config zlib1g-dev libltdl-dev python3-setuptools python3-wheel \
            gcc-multilib g++-multilib

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer==1.5.0
          pip install --user -r requirements.txt
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Android environment
        run: |
          export SDK_PATH=/usr/local/lib/android/sdk
          export NDK_PATH=$SDK_PATH/ndk/25.2.9519653

          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV

          sudo mkdir -p $SDK_PATH/tools/bin
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/sdkmanager $SDK_PATH/tools/bin/sdkmanager
          sudo ln -sf $SDK_PATH/cmdline-tools/latest/bin/avdmanager $SDK_PATH/tools/bin/avdmanager

          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
          $SDK_PATH/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "platforms;android-33" \
            "build-tools;34.0.0" "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Decode keystore (for AAB)
        if: ${{ needs.setup-env.outputs.keystore_available == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > signing.keystore

      - name: Prepare buildozer.spec
        run: |
          echo "=== Original buildozer.spec ==="
          cat buildozer.spec
          
          # Ensure AAB format
          sed -i "s|^#*android.release_artifact *=.*|android.release_artifact = aab|" buildozer.spec
          
          # Ensure arch is set
          if ! grep -q "^android.archs" buildozer.spec; then
            echo "android.archs = arm64-v8a" >> buildozer.spec
          fi

          # Configure keystore if available
          if [ "${{ needs.setup-env.outputs.keystore_available }}" == "true" ]; then
            echo "🔑 Configuring keystore for release signing"
            sed -i "s|^#*android.release_keystore *=.*|android.release_keystore = %(source.dir)s/signing.keystore|" buildozer.spec
            sed -i "s|^#*android.release_key *=.*|android.release_key = ${{ secrets.KEY_ALIAS }}|" buildozer.spec
            sed -i "s|^#*android.release_key_passwd *=.*|android.release_key_passwd = ${{ secrets.KEY_PASSWORD }}|" buildozer.spec
            sed -i "s|^#*android.release_keystore_passwd *=.*|android.release_keystore_passwd = ${{ secrets.KEYSTORE_PASSWORD }}|" buildozer.spec
          else
            echo "⚠️ No keystore available - building unsigned AAB"
          fi
          
          echo "=== Modified buildozer.spec ==="
          cat buildozer.spec

      - name: Clean AAB build
        run: |
          buildozer android clean || true
          rm -rf .buildozer/android/platform/build-*

      - name: Build AAB (release)
        env:
          # Variables d'environnement pour python-for-android signature
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/signing.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Enable debug mode for more verbose output
          export BUILDOZER_LOG_LEVEL=2
          
          # Vérifier les variables de signature
          if [ "${{ needs.setup-env.outputs.keystore_available }}" == "true" ]; then
            echo "🔑 Signature variables set:"
            echo "P4A_RELEASE_KEYSTORE: $P4A_RELEASE_KEYSTORE"
            echo "P4A_RELEASE_KEYALIAS: $P4A_RELEASE_KEYALIAS"
            echo "Keystore exists: $(test -f $P4A_RELEASE_KEYSTORE && echo 'YES' || echo 'NO')"
          else
            echo "⚠️ No signing variables - building unsigned"
          fi
          
          timeout 3600 buildozer android release --verbose || {
            echo "⚠️ First AAB build failed, listing files and retrying with clean"
            echo "=== Current directory contents ==="
            ls -la
            echo "=== bin directory contents ==="
            ls -la bin/ || echo "No bin directory"
            echo "=== .buildozer structure ==="
            find .buildozer -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK found"
            
            buildozer android clean
            timeout 3600 buildozer android release --verbose || {
              echo "❌ Second attempt failed, showing final structure"
              ls -la
              ls -la bin/ || echo "Still no bin directory"
              exit 1
            }
          }

      - name: List build outputs
        if: always()
        run: |
          echo "=== Final directory contents ==="
          ls -la
          echo "=== bin directory contents ==="
          ls -la bin/ || echo "No bin directory found"
          echo "=== Searching for AAB files ==="
          find . -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: |
            bin/*.aab
          retention-days: 90
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            aab_build*.log
            .buildozer/**/*.log
          retention-days: 7

      - name: Manual AAB signing (if needed)
        if: ${{ needs.setup-env.outputs.keystore_available == 'true' }}
        run: |
          echo "=== Checking AAB signature status ==="
          
          # Trouver le fichier AAB
          AAB_FILE=$(find . -name "*.aab" -type f | head -1)
          
          if [ -z "$AAB_FILE" ]; then
            echo "❌ No AAB file found"
            exit 1
          fi
          
          echo "Found AAB: $AAB_FILE"
          
          # Vérifier si l'AAB est déjà signé
          if jarsigner -verify "$AAB_FILE" 2>/dev/null; then
            echo "✅ AAB is already signed"
          else
            echo "⚠️ AAB is not signed, signing manually..."
            
            # Copier l'AAB pour signature
            SIGNED_AAB="${AAB_FILE%.*}-signed.aab"
            cp "$AAB_FILE" "$SIGNED_AAB"
            
            # Signer l'AAB
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore signing.keystore \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              "$SIGNED_AAB" "${{ secrets.KEY_ALIAS }}"
            
            if [ $? -eq 0 ]; then
              echo "✅ AAB signed successfully"
              
              # Vérifier la signature
              if jarsigner -verify -verbose -certs "$SIGNED_AAB"; then
                echo "✅ Signature verification passed"
                
                # Remplacer l'AAB original par la version signée
                mv "$SIGNED_AAB" "$AAB_FILE"
                echo "Original AAB replaced with signed version"
              else
                echo "❌ Signature verification failed"
                exit 1
              fi
            else
              echo "❌ AAB signing failed"
              exit 1
            fi
          fi
