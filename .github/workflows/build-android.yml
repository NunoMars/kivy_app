name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.py'
      - '*.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '*.py'
      - '*.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git unzip zip
        sudo apt install -y libbz2-dev libsqlite3-dev libssl-dev
        sudo apt install -y libffi-dev libncurses5-dev libgdbm-dev
        sudo apt install -y autotools-dev automake autoconf libtool
        sudo apt install -y pkg-config zlib1g-dev libltdl-dev
        sudo apt install -y python3-setuptools python3-wheel
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --user 'cython==0.29.36'
        pip install --user 'buildozer==1.5.0'
        pip install --user -r requirements.txt
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
    - name: Setup Android SDK compatibility for buildozer
      run: |
        # Créer les liens symboliques pour compatibilité buildozer avec Android SDK
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager /usr/local/lib/android/sdk/tools/bin/avdmanager
        
        # Vérifier les liens
        echo "✅ SDK compatibility links created:"
        ls -la /usr/local/lib/android/sdk/tools/bin/
        
        # Vérifier que sdkmanager fonctionne
        /usr/local/lib/android/sdk/tools/bin/sdkmanager --version || echo "⚠️ sdkmanager test failed"
        
        # Accepter les licences Android si nécessaire
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || echo "✅ Licenses accepted"
        
    - name: Setup Android keystore (if secrets available)
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      run: |
        if [ ! -z "$ANDROID_KEYSTORE" ]; then
          echo "$ANDROID_KEYSTORE" | base64 -d > signing.keystore
          echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV
          echo "✅ Keystore configured for AAB signing"
        else
          echo "KEYSTORE_AVAILABLE=false" >> $GITHUB_ENV
          echo "⚠️ No keystore configured - will build unsigned AAB"
        fi
        
    - name: Build APK (debug)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        echo "=== Building Debug APK ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "JAVA_HOME: $JAVA_HOME"
        
        # Vérifier que les outils sont accessibles
        which java && java -version
        which javac && javac -version
        ls -la $ANDROID_HOME/tools/bin/sdkmanager
        
        buildozer android debug --verbose
        
    - name: Build AAB (release)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "=== Building Release AAB ==="
        
        # Configure keystore passwords if secrets are available
        if [ -f "signing.keystore" ] && [ ! -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
          # Update buildozer.spec with keystore credentials
          sed -i "s/android.release_keystore_passwd = /android.release_keystore_passwd = $ANDROID_KEYSTORE_PASSWORD/" buildozer.spec
          sed -i "s/android.release_key = /android.release_key = $ANDROID_KEY_ALIAS/" buildozer.spec
          sed -i "s/android.release_key_passwd = /android.release_key_passwd = $ANDROID_KEY_PASSWORD/" buildozer.spec
          echo "✅ Keystore credentials configured"
        else
          echo "⚠️ Building unsigned AAB (no keystore secrets)"
        fi
        
        # Vérifier que android.release_artifact = aab dans buildozer.spec
        grep "android.release_artifact = aab" buildozer.spec || echo "⚠️ android.release_artifact not set to aab"
        
        # Build release (AAB car android.release_artifact = aab)
        buildozer android release --verbose
        
    - name: Verify build outputs
      run: |
        echo "=== Build verification ==="
        echo "APK files:"
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        echo "AAB files:"
        find . -name "*.aab" -type f 2>/dev/null || echo "No AAB found"
        
        echo "=== Contents of bin/ directory ==="
        ls -la bin/ 2>/dev/null || echo "bin/ directory not found"
        
        # Check for debug APK (various possible names)
        if ls bin/*debug*.apk 2>/dev/null; then
          echo "✅ Debug APK found"
          ls -lh bin/*debug*.apk
        elif ls bin/*.apk 2>/dev/null; then
          echo "✅ APK found"
          ls -lh bin/*.apk
        fi
        
        # Check for release AAB (various possible names)
        if ls bin/*release*.aab 2>/dev/null; then
          echo "✅ Release AAB found"
          ls -lh bin/*release*.aab
          if [ -f "signing.keystore" ]; then
            echo "✅ AAB is signed and ready for Play Store"
          else
            echo "⚠️ AAB is unsigned"
          fi
        elif ls bin/*.aab 2>/dev/null; then
          echo "✅ AAB found"
          ls -lh bin/*.aab
          if [ -f "signing.keystore" ]; then
            echo "✅ AAB is signed and ready for Play Store"
          else
            echo "⚠️ AAB is unsigned"
          fi
        fi
        
    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-debug
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/dists/*/bin/*.apk
        retention-days: 30
        
    - name: Upload AAB artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-build
        path: |
          bin/*.aab
          .buildozer/android/platform/build-*/dists/*/bin/*.aab
        retention-days: 90
