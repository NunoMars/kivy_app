name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permet déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-22.04  # Utiliser Ubuntu 22.04 pour éviter les conflits autotools
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache buildozer global directory
      uses: actions/cache@v3
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        
    - name: Cache buildozer directory
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget sed coreutils grep
        sudo apt-get install -y python3-pip python3-setuptools build-essential
        sudo apt-get install -y libffi-dev libssl-dev libssl3 openssl autotools-dev automake
        sudo apt-get install -y libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev
        sudo apt-get install -y libncursesw5-dev libtinfo6 cmake autoconf
        
        # Configurer pkg-config pour OpenSSL
        export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        
        # Vérifier pkg-config et OpenSSL
        pkg-config --exists openssl && echo "OpenSSL pkg-config OK" || echo "OpenSSL pkg-config FAIL"
        pkg-config --modversion openssl || echo "No OpenSSL version"
        
        # Vérifier que les outils de base fonctionnent
        /usr/bin/which git
        /usr/bin/which grep
        /usr/bin/which sed
        /usr/bin/which ls
        /usr/bin/which mkdir
        /usr/bin/which libtool
        /usr/bin/which autoconf
        git --version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0
        pip install cython==0.29.33
        pip install kivy==2.2.0
        pip install python-for-android==2023.5.21  # Version stable disponible
        
    - name: Set up Android SDK manually
      run: |
        # Créer le répertoire SDK
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        
        # Télécharger et installer Command Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        
        # Créer le script wrapper sdkmanager pour le chemin legacy
        mkdir -p android-sdk/tools/bin
        cat > android-sdk/tools/bin/sdkmanager << 'EOFSCRIPT'
        #!/bin/bash
        exec "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$@"
        EOFSCRIPT
        chmod +x android-sdk/tools/bin/sdkmanager
        
        # Variables d'environnement
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Accepter les licences et installer les composants
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2"
        
        # Vérifier l'installation
        echo "=== Checking Android SDK installation ==="
        if [ -d "$ANDROID_HOME/build-tools/" ]; then
          ls -la "$ANDROID_HOME/build-tools/"
        else
          echo "Build tools directory not found"
        fi
        
        # Vérifier le script wrapper
        echo "=== Checking sdkmanager wrapper ==="
        ls -la "$ANDROID_HOME/tools/bin/" || echo "Legacy tools/bin not found"
        cat "$ANDROID_HOME/tools/bin/sdkmanager"
        
    - name: Update buildozer config
      run: |
        # Utiliser le script Python pour mettre à jour buildozer.spec
        python3 .github/scripts/update_buildozer.py
        
    - name: Prepare python-for-android
      run: |
        # Créer les répertoires nécessaires pour éviter les erreurs
        mkdir -p $HOME/.buildozer/android/platform/python-for-android
        mkdir -p .buildozer/android/platform
        
    - name: Build APK with Buildozer
      env:
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        PATH: /usr/bin:/bin:/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:/home/runner/.buildozer/android/platform/android-sdk/platform-tools:$PATH
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
        AUTOCONF_VERSION: 2.71
        AUTOM4TE_PERLLIBDIR: /usr/share/autotools-dev
      run: |
        # Debug pkg-config et OpenSSL avant build
        echo "=== PKG_CONFIG debugging ==="
        echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
        pkg-config --exists openssl && echo "✅ OpenSSL pkg-config OK" || echo "❌ OpenSSL pkg-config FAIL"
        pkg-config --libs openssl || echo "❌ No OpenSSL libs"
        pkg-config --cflags openssl || echo "❌ No OpenSSL cflags"
        
        # Debug autotools versions
        echo "=== Autotools versions ==="
        autoconf --version | head -1
        automake --version | head -1 
        libtool --version | head -1
        
        # Debug buildozer.spec
        echo "=== Buildozer.spec Android config ==="
        grep -E "(android\.(api|sdk|ndk|accept)|sdk_path|ndk_path)" buildozer.spec || echo "No Android config found"
        
        # Afficher les variables d'environnement
        echo "=== Environment ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "PATH: $PATH"
        if [ -d "$ANDROID_HOME/build-tools/" ]; then
          ls -la "$ANDROID_HOME/build-tools/" || echo "Build tools directory exists but ls failed"
        else
          echo "Build tools not found"
        fi
        
        # Test du sdkmanager wrapper
        echo "=== Testing sdkmanager wrapper ==="
        if [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
          echo "Wrapper script exists and is executable"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version || echo "Wrapper test failed"
        else
          echo "Wrapper script not found or not executable"
        fi
        
        # Build debug APK avec requirements optimisés pour Android
        echo "=== Starting buildozer build ==="
        
        # Vérifier les requirements après update_buildozer.py
        echo "Requirements configurés:"
        grep "requirements =" buildozer.spec
        
        # Vérifier qu'aucun cache ne contient Pillow
        echo "=== Cleaning any potential Pillow cache ==="
        if [ -d ".buildozer" ]; then
          echo "Removing existing .buildozer cache..."
          rm -rf .buildozer
        fi
        
        # Nettoyer le cache global buildozer aussi
        if [ -d "$HOME/.buildozer" ]; then
          echo "Cleaning global buildozer cache..."
          rm -rf "$HOME/.buildozer/android/platform/python-for-android-fork"
          rm -rf "$HOME/.buildozer/android/platform/python-for-android"
        fi
        
        # Build avec fresh start
        echo "=== Building APK with fresh cache ==="
        buildozer android debug --verbose
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-debug
        path: bin/*.apk
        retention-days: 30
        
    - name: List generated files
      run: |
        echo "=== Generated files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        if [ -d "bin/" ]; then
          ls -la bin/
        else
          echo "No bin directory"
        fi
