name: Deploy Release to Play Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release à déployer'
        required: true
        default: 'v1.0.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.release_tag || github.ref }}
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          libffi-dev \
          libssl-dev \
          libtool \
          pkg-config \
          python3-dev \
          python3-pip \
          autotools-dev \
          autoconf \
          automake \
          cmake \
          gettext \
          libltdl-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          unzip \
          zip
          
    - name: Setup Android SDK
      run: |
        # Installation manuelle du SDK Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        
        # Accepter les licences
        yes | sdkmanager --licenses
        
        # Installer les composants nécessaires
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
    - name: Clean environment and install Python deps
      run: |
        export PATH="/usr/bin:$PATH"
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36
        pip install -r requirements.txt
        pip install buildozer python-for-android
        
    - name: Verify project structure
      run: |
        echo "=== Structure du projet ==="
        ls -la
        echo "=== Contenu buildozer.spec ==="
        head -20 buildozer.spec
        echo "=== Images tarot ==="
        ls -la tarot_img/ | head -10
        
    - name: Setup keystore for signing
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.keystore
        chmod 600 release.keystore
        
    - name: Build AAB with Buildozer (RELEASE)
      run: |
        export ANDROIDSDK="$ANDROID_SDK_ROOT"
        export ANDROIDNDK="$ANDROID_SDK_ROOT/ndk-bundle"
        export ANDROIDAPI="34"
        export NDKAPI="21"
        export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
        export PATH="$JAVA_HOME/bin:$PATH"
        
        # Clean et build release
        buildozer android clean
        buildozer android release
        
    - name: Sign AAB
      run: |
        # Vérifier que l'AAB non signé existe
        find . -name "*.aab" -type f
        
        # Signer l'AAB avec jarsigner
        AAB_FILE=$(find . -name "*-release-unsigned.aab" | head -1)
        if [ -n "$AAB_FILE" ]; then
          echo "Signature de: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "$AAB_FILE" \
            "${{ secrets.ANDROID_KEY_ALIAS }}"
          
          # Renommer le fichier signé
          SIGNED_AAB="${AAB_FILE/-unsigned/-signed}"
          mv "$AAB_FILE" "$SIGNED_AAB"
          echo "AAB signé: $SIGNED_AAB"
        else
          echo "❌ Aucun fichier AAB trouvé"
          exit 1
        fi
        
    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab-${{ github.run_number }}
        path: "**/*-signed.aab"
        
    - name: Create deployment summary
      run: |
        echo "## 🚀 Déploiement Release" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ AAB signé généré avec succès" >> $GITHUB_STEP_SUMMARY
        echo "- Tag: ${{ github.event.inputs.release_tag || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Prêt pour le Play Store" >> $GITHUB_STEP_SUMMARY
        echo "Le fichier AAB signé est prêt à être uploadé sur Google Play Console." >> $GITHUB_STEP_SUMMARY
