name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permet déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache buildozer global directory
      uses: actions/cache@v3
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        
    - name: Cache buildozer directory
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget sed coreutils grep
        sudo apt-get install -y python3-pip python3-setuptools build-essential
        sudo apt-get install -y libffi-dev libssl-dev autotools-dev automake
        sudo apt-get install -y libtool pkg-config zlib1g-dev libncurses5-dev
        sudo apt-get install -y libncursesw5-dev libtinfo6 cmake
        
        # Vérifier que les outils de base fonctionnent
        /usr/bin/which git
        /usr/bin/which grep
        /usr/bin/which sed
        /usr/bin/which ls
        /usr/bin/which mkdir
        git --version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0
        pip install cython==0.29.33
        pip install kivy==2.2.0
        pip install python-for-android==2024.1.21
        
    - name: Set up Android SDK manually
      run: |
        # Créer le répertoire SDK
        /usr/bin/mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        
        # Télécharger et installer Command Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        /usr/bin/mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        
        # Créer le lien symbolique pour le chemin legacy du sdkmanager
        /usr/bin/mkdir -p android-sdk/tools
        ln -sf ../cmdline-tools/latest/bin android-sdk/tools/bin
        
        # Variables d'environnement
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Accepter les licences et installer les composants
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2"
        
        # Vérifier l'installation
        echo "=== Checking Android SDK installation ==="
        if [ -d "$ANDROID_HOME/build-tools/" ]; then
          /usr/bin/ls -la "$ANDROID_HOME/build-tools/"
        else
          echo "Build tools directory not found"
        fi
        
        # Vérifier le lien symbolique
        echo "=== Checking sdkmanager paths ==="
        /usr/bin/ls -la "$ANDROID_HOME/tools/bin/" || echo "Legacy tools/bin not found"
        
    - name: Update buildozer config
      run: |
        # Utiliser le script Python pour mettre à jour buildozer.spec
        python3 .github/scripts/update_buildozer.py
        
    - name: Prepare python-for-android
      run: |
        # Créer les répertoires nécessaires pour éviter les erreurs
        /usr/bin/mkdir -p $HOME/.buildozer/android/platform/python-for-android
        /usr/bin/mkdir -p .buildozer/android/platform
        
    - name: Build APK with Buildozer
      env:
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        PATH: /usr/bin:/bin:/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:/home/runner/.buildozer/android/platform/android-sdk/platform-tools:$PATH
      run: |
        # Debug buildozer.spec
        echo "=== Buildozer.spec Android config ==="
        /usr/bin/grep -E "(android\.(api|sdk|ndk|accept)|sdk_path|ndk_path)" buildozer.spec || echo "No Android config found"
        
        # Afficher les variables d'environnement
        echo "=== Environment ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "PATH: $PATH"
        if [ -d "$ANDROID_HOME/build-tools/" ]; then
          /usr/bin/ls -la "$ANDROID_HOME/build-tools/" || echo "Build tools directory exists but ls failed"
        else
          echo "Build tools not found"
        fi
        
        # Build debug APK
        echo "=== Starting buildozer build ==="
        buildozer android debug --verbose
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-debug
        path: bin/*.apk
        retention-days: 30
        
    - name: List generated files
      run: |
        echo "=== Generated files ==="
        /usr/bin/find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        if [ -d "bin/" ]; then
          /usr/bin/ls -la bin/
        else
          echo "No bin directory"
        fi
