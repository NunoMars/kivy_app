name: Publish Android App

on:
  push:
    tags:
      - 'v*'  # Déclenche sur les tags version (ex: v1.0.0)
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04  # Cohérent avec build-android.yml
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget coreutils
        sudo apt-get install -y autotools-dev automake libtool libtool-bin pkg-config
        sudo apt-get install -y build-essential libffi-dev libssl-dev zlib1g-dev
        sudo apt-get install -y libncurses5-dev libncursesw5-dev cmake autoconf
        
        # Configure Java 17 pour Gradle avec PATH complet
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
        
        # Vérifier Java immédiatement
        echo "=== Java Configuration Verification ==="
        which java
        java -version
        echo "JAVA_HOME: $JAVA_HOME"
        
        # Configurer pkg-config pour OpenSSL
        export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33 kivy==2.2.0
        pip install python-for-android==2023.5.21  # Version cohérente
        
    - name: Set up Android SDK
      run: |
        # Utiliser le SDK Android pré-installé de GitHub Actions
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
        
        # Vérifier l'installation
        echo "Android SDK: $ANDROID_HOME"
        echo "Android NDK: $ANDROID_NDK_HOME"
        ls -la $ANDROID_HOME/
        ls -la $ANDROID_NDK_HOME/
        
    - name: Update buildozer config for GitHub Actions
      run: |
        # Utiliser le script Python qui supprime Pillow automatiquement
        python3 .github/scripts/update_buildozer.py
        
        # Vérifier que Pillow est bien supprimé
        echo "=== Requirements après script ==="
        grep "requirements =" buildozer.spec
        
        # Vérifier les autres configurations
        echo "=== Config Android ==="
        grep -E "(android\.(api|ndk|accept)|sdk_path|ndk_path)" buildozer.spec
        
    - name: Build AAB (App Bundle) with Buildozer
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        PATH: /usr/lib/jvm/temurin-17-jdk-amd64/bin:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/bin:/bin
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
      run: |
        # Forcer Java 17 pour éviter les erreurs Gradle
        echo "=== Java Configuration ==="
        echo "JAVA_HOME: $JAVA_HOME"
        echo "PATH: $PATH"
        which java
        java -version
        
        # Initialiser buildozer si nécessaire
        buildozer init || echo "Already initialized"
        
        # Build App Bundle (AAB) au lieu d'APK pour Google Play
        echo "=== Building Android App Bundle (AAB) ==="
        buildozer android debug --aab || {
          echo "❌ AAB build failed, trying APK as fallback..."
          buildozer android debug --verbose
        }

    - name: Build Release AAB (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        PATH: /usr/lib/jvm/temurin-17-jdk-amd64/bin:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/bin:/bin
      run: |
        echo "=== Building Release AAB for Google Play ==="
        
        # Vérifier si nous avons une clé de signature
        if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "🔑 Clé de signature détectée, construction en mode release..."
          
          # Décoder la clé de signature
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          # Configurer buildozer pour la signature
          echo "" >> buildozer.spec
          echo "[app:android.gradle_dependencies]" >> buildozer.spec
          echo "android.gradle_dependencies = " >> buildozer.spec
          
          # Build release AAB signé
          buildozer android release
        else
          echo "⚠️  Pas de clé de signature configurée"
          echo "   Pour publier sur Google Play, il faut :"
          echo "   1. Générer une clé de signature Android"
          echo "   2. L'encoder en base64 et l'ajouter comme secret ANDROID_KEYSTORE_BASE64"
          echo "   3. Ajouter les secrets KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
          echo ""
          echo "   Pour l'instant, le debug AAB sera utilisé."
        fi
        
    - name: Upload App Bundle (AAB) as artifact
      uses: actions/upload-artifact@v4
      with:
        name: tarot-app-bundle
        path: |
          bin/*.aab
          bin/*.apk
        retention-days: 30
        
    - name: Upload to Google Play Console
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: org.tarot.macartedetarot  # Nom de package cohérent
        releaseFiles: bin/*.aab
        track: internal  # Commence par internal, puis promotion vers production
        status: completed
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          🔮 **Ma Carte de Tarot - Version ${{ github.ref_name }}**
          
          📱 **App Bundle Android disponible**
          - Format AAB optimisé pour Google Play Store
          - Compatible avec toutes les architectures Android
          - Taille optimisée selon votre appareil
          
          ✨ **Nouvelles fonctionnalités :**
          - Interface améliorée
          - Performance optimisée
          - Corrections de bugs
          
          📋 **Installation :**
          - Téléchargez le fichier .aab depuis les artifacts
          - Ou attendez la publication sur Google Play Store
          
          🔮 **Guidance spirituelle authentique avec le Tarot de Marseille !**
        draft: false
        prerelease: false
        
    - name: Upload AAB to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: bin/macartedetarot-${{ github.ref_name }}.aab
        asset_name: ma-carte-tarot-${{ github.ref_name }}.aab
        asset_content_type: application/vnd.android.package-archive
