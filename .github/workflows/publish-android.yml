name: Build and Publish Android App

on:
  push:
    tags:
      - 'v*'  # Déclenche sur les tags version (ex: v1.0.0)
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_HOME: /opt/android-sdk
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython kivy Pillow

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk unzip zip libgl1-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 libmtdev-dev \
          autotools-dev automake libtool libtool-bin pkg-config build-essential libffi-dev libssl-dev \
          libncurses5-dev libncursesw5-dev cmake autoconf

    - name: Install Android SDK & NDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        sudo unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "platform-tools" "platforms;android-34" "build-tools;${{ env.BUILD_TOOLS_VERSION }}" "ndk;26.1.10909125"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

    - name: Prepare Buildozer Configuration
      run: |
        echo "🔧 Préparation de la configuration buildozer..."
        
        # Créer/vérifier l'icône Android
        python3 create_android_icon.py
        
        # Appliquer les corrections buildozer
        python3 fix_buildozer_errors.py
        
        # Vérifications
        if [ -f "tarot_img/icon.png" ]; then
          echo "✅ Icône Android: tarot_img/icon.png"
          ls -la tarot_img/icon.png
        else
          echo "❌ Icône Android manquante"
          exit 1
        fi
        
        if [ -f "android_manifest_template.xml" ]; then
          echo "✅ Template AndroidManifest créé"
        else
          echo "❌ Template AndroidManifest manquant"
          exit 1
        fi

    - name: Build Android AAB
      run: |
        echo "🏗️ Construction de l'Android App Bundle..."
        
        # Nettoyer toute configuration de signature existante
        sed -i '/android\.release_keystore/d' buildozer.spec
        sed -i '/android\.release_key/d' buildozer.spec
        sed -i '/# Configuration signature/d' buildozer.spec
        
        # Créer une clé temporaire pour le build initial
        keytool -genkey -v -keystore temp.keystore -alias tempkey -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=TempBuild, OU=Build, O=Build, L=Build, S=Build, C=US" \
          -storepass temppass -keypass temppass
        
        # Configurer buildozer avec la clé temporaire
        echo "" >> buildozer.spec
        echo "# Configuration signature temporaire pour build" >> buildozer.spec
        echo "android.release_keystore = temp.keystore" >> buildozer.spec
        echo "android.release_keystore_passwd = temppass" >> buildozer.spec
        echo "android.release_key = tempkey" >> buildozer.spec
        echo "android.release_key_passwd = temppass" >> buildozer.spec
        
        # S'assurer que le mode AAB est activé dans buildozer.spec
        if ! grep -q "android.release_artifact = aab" buildozer.spec; then
          echo "android.release_artifact = aab" >> buildozer.spec
        fi
        
        # Build avec buildozer android release (qui génère un AAB si configuré)
        echo "🔨 Exécution de buildozer android release..."
        if timeout 1800 buildozer android release --verbose; then
          echo "✅ Build réussi!"
          
          # Lister les fichiers générés
          echo "📱 Fichiers générés:"
          find bin/ -name "*.aab" -o -name "*.apk" | head -10
          
          # Copier les fichiers avec des noms standardisés
          if find bin/ -name "*.aab" | head -1 | read aab_file; then
            echo "📱 AAB trouvé: $aab_file"
            cp "$aab_file" "bin/macartedetarot-release.aab"
          fi
          
          if find bin/ -name "*.apk" | head -1 | read apk_file; then
            echo "📱 APK trouvé: $apk_file"
            cp "$apk_file" "bin/macartedetarot-release.apk"
          fi
        else
          echo "❌ Build échoué"
          
          # Afficher les logs pour diagnostic
          if [ -f ".buildozer/logs/buildozer.log" ]; then
            echo "=== Dernières lignes du log buildozer ==="
            tail -50 .buildozer/logs/buildozer.log
          fi
          
          exit 1
        fi

    - name: Decode Production Keystore
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "🔑 Décodage de la clé de production..."
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > production.keystore
        
        # Vérifier la clé
        keytool -list -keystore production.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || {
          echo "❌ Clé de production invalide"
          exit 1
        }

    - name: Sign AAB with Production Key
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "🔏 Signature de l'AAB avec la clé de production..."
        
        # Trouver l'AAB généré
        AAB_PATH=$(find bin/ -name "*.aab" | head -n 1)
        if [ -z "$AAB_PATH" ]; then
          echo "❌ Aucun AAB trouvé!"
          exit 1
        fi
        
        echo "📱 AAB trouvé: $AAB_PATH"
        
        # Signer avec apksigner (requis pour Google Play)
        $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner sign \
          --ks production.keystore \
          --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
          --out "bin/macartedetarot-production.aab" \
          "$AAB_PATH"
        
        # Vérifier la signature
        echo "🔍 Vérification de la signature..."
        if $ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify "bin/macartedetarot-production.aab"; then
          echo "✅ AAB correctement signé avec clé de production"
        else
          echo "❌ Erreur de signature"
          exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tarot-app-bundle
        path: |
          bin/*.aab
          bin/*.apk
        retention-days: 30
        
    - name: Upload to Google Play Console
      if: startsWith(github.ref, 'refs/tags/') && success()
      continue-on-error: true
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: org.tarot.macartedetarot
        releaseFiles: bin/macartedetarot-production.aab
        track: internal
        status: completed
        
    - name: Manual Upload Instructions
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "📱 Si l'upload automatique a échoué (première fois), suivez ces étapes :"
        echo "1. 🌐 Allez sur : https://play.google.com/console/"
        echo "2. 📂 Cliquez sur : Ma Carte de Tarot"
        echo "3. 🚀 Production → Créer une nouvelle version"
        echo "4. 📤 Uploadez : bin/macartedetarot-production.aab"
        echo "5. ✅ Publiez en Internal testing"
        echo ""
        echo "🔄 Après la première publication manuelle, l'upload automatique fonctionnera !"
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          🔮 **Ma Carte de Tarot - Version ${{ github.ref_name }}**
          
          📱 **App Bundle Android disponible**
          - Format AAB optimisé pour Google Play Store
          - Compatible avec toutes les architectures Android
          - Signature de production valide
          
          ✨ **Nouvelles fonctionnalités :**
          - Interface améliorée
          - Performance optimisée
          - Corrections de bugs
          
          📋 **Installation :**
          - Téléchargez le fichier .aab depuis les artifacts
          - Ou attendez la publication sur Google Play Store
          
          🔮 **Guidance spirituelle authentique avec le Tarot de Marseille !**
        draft: false
        prerelease: false
        
    - name: Upload AAB to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: bin/macartedetarot-production.aab
        asset_name: ma-carte-tarot-${{ github.ref_name }}.aab
        asset_content_type: application/vnd.android.package-archive
