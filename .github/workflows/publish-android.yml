name: Publish Android App

on:
  push:
    tags:
      - 'v*'  # Déclenche sur les tags version (ex: v1.0.0)
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget coreutils
        sudo apt-get install -y autotools-dev automake libtool pkg-config
        sudo apt-get install -y build-essential libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33 kivy==2.2.0
        pip install python-for-android==2024.1.21
        
    - name: Set up Android SDK
      run: |
        # Utiliser le SDK Android pré-installé de GitHub Actions
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
        
        # Vérifier l'installation
        echo "Android SDK: $ANDROID_HOME"
        echo "Android NDK: $ANDROID_NDK_HOME"
        ls -la $ANDROID_HOME/
        ls -la $ANDROID_NDK_HOME/
        
    - name: Update buildozer config for GitHub Actions
      run: |
        # Mettre à jour buildozer.spec pour utiliser le NDK pré-installé
        sed -i 's/android.ndk = 25b/android.ndk = 27.2.12479018/' buildozer.spec
        sed -i 's/#android.sdk_path =/android.sdk_path = \/usr\/local\/lib\/android\/sdk/' buildozer.spec
        sed -i 's/#android.ndk_path =/android.ndk_path = \/usr\/local\/lib\/android\/sdk\/ndk\/27.2.12479018/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        # Vérifier les modifications
        echo "=== Buildozer config ==="
        grep -E "(android\.(api|ndk|accept)|sdk_path|ndk_path)" buildozer.spec
        
    - name: Build APK with Buildozer
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH
      run: |
        # Initialiser buildozer si nécessaire
        buildozer init || echo "Already initialized"
        
        # Build debug APK
        buildozer android debug --verbose

    - name: Sign APK for Release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Conversion en AAB pour Google Play (nécessite keystore configuré)
        echo "Building release APK..."
        buildozer android release || echo "Release build failed - keystore needed"
        
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: tarot-app-apk
        path: bin/*.apk
        
    - name: Upload to Google Play Console
      if: startsWith(github.ref, 'refs/tags/')
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: Ma carte de Tarot
        releaseFiles: bin/*.aab
        track: internal  # ou 'production' pour publication directe
        status: completed
