name: Publish Android App

on:
  push:
    tags:
      - 'v*'  # Déclenche sur les tags version (ex: v1.0.0)
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04  # Cohérent avec build-android.yml
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget coreutils
        sudo apt-get install -y autotools-dev automake libtool libtool-bin pkg-config
        sudo apt-get install -y build-essential libffi-dev libssl-dev zlib1g-dev
        sudo apt-get install -y libncurses5-dev libncursesw5-dev cmake autoconf
        
        # Configure Java 17 pour Gradle avec PATH complet
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
        
        # Vérifier Java immédiatement
        echo "=== Java Configuration Verification ==="
        which java
        java -version
        echo "JAVA_HOME: $JAVA_HOME"
        
        # Configurer pkg-config pour OpenSSL
        export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33 kivy==2.2.0
        pip install python-for-android==2023.5.21  # Version cohérente
        
    - name: Set up Android SDK
      run: |
        # Utiliser le SDK Android pré-installé de GitHub Actions
        export ANDROID_HOME=/usr/local/lib/android/sdk
        # Utiliser NDK 25c qui est compatible avec SDL2 et recommandé par p4a
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
        
        # Vérifier si NDK 25c existe, sinon l'installer
        if [ ! -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
          echo "📥 Installation NDK 25c (compatible SDL2)..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
        fi
        
        # Créer un lien symbolique pour l'ancien chemin de sdkmanager (compatibilité buildozer)
        sudo mkdir -p $ANDROID_HOME/tools/bin
        sudo ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        sudo ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager
        
        # Vérifier l'installation et les liens
        echo "Android SDK: $ANDROID_HOME"
        echo "Android NDK: $ANDROID_NDK_HOME"
        echo "sdkmanager location:"
        which sdkmanager || echo "sdkmanager not in PATH"
        ls -la $ANDROID_HOME/tools/bin/ || echo "tools/bin not found"
        ls -la $ANDROID_HOME/cmdline-tools/latest/bin/ | head -5
        
        # Vérifier NDK 25c
        if [ -d "$ANDROID_NDK_HOME" ]; then
          echo "✅ NDK 25c trouvé: $ANDROID_NDK_HOME"
          ls -la $ANDROID_NDK_HOME/ | head -3
        else
          echo "❌ NDK 25c non trouvé"
        fi
        
        # Tester sdkmanager
        $ANDROID_HOME/tools/bin/sdkmanager --version || echo "sdkmanager test failed"
        
    - name: Install Pillow (Python Imaging Library)
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install Pillow

    - name: Fix Buildozer Configuration and Create Android Icon
      run: |
        echo "🔧 Application des corrections buildozer..."
        
        # Créer l'icône Android PNG
        python3 create_android_icon.py
        
        # Appliquer les corrections buildozer
        python3 fix_buildozer_errors.py
        
        # Vérifier que l'icône a été créée
        if [ -f "tarot_img/icon.png" ]; then
          echo "✅ Icône Android créée: tarot_img/icon.png"
          ls -la tarot_img/icon.png
        else
          echo "❌ Icône Android non créée"
          exit 1
        fi
        
        # Vérifier que le template manifest a été créé
        if [ -f "android_manifest_template.xml" ]; then
          echo "✅ Template AndroidManifest créé"
        else
          echo "❌ Template AndroidManifest non créé"
          exit 1
        fi
        
        echo "✅ Corrections buildozer appliquées"

    - name: Configure buildozer for GitHub Actions SDK/NDK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      run: |
        # Utiliser le nouveau script qui force l'utilisation des SDK/NDK système
        python3 .github/scripts/configure_buildozer_sdk.py
        
        # Exécuter le diagnostic et correction des chemins SDK
        python3 .github/scripts/fix_sdk_paths.py
        
        # Vérifier la configuration finale
        echo "=== Configuration buildozer finale ==="
        grep -E "(requirements|android\.(sdk_path|ndk_path|ndk|api))" buildozer.spec
        
    - name: Build AAB (App Bundle) with Buildozer
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        PATH: /usr/lib/jvm/temurin-17-jdk-amd64/bin:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/bin:/bin
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
      run: |
        # Vérifier l'environnement avant le build
        echo "=== Environnement de build ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "JAVA_HOME: $JAVA_HOME"
        which java
        java -version
        
        # Vérifier que les SDK/NDK existent
        echo "=== Vérification SDK/NDK ==="
        ls -la $ANDROID_HOME/ | head -10
        ls -la $ANDROID_NDK_HOME/ | head -5
        
        # Initialiser buildozer avec timeout
        echo "=== Initialisation buildozer ==="
        timeout 300 buildozer init || echo "Already initialized or timeout"
        
        # Vérifier la configuration buildozer finale
        echo "=== Configuration buildozer ==="
        grep -E "(android\.(sdk_path|ndk_path|ndk|api|.*artifact)|requirements)" buildozer.spec
        
        # Build App Bundle (AAB) avec buildozer android release
        echo "=== Build Android App Bundle (AAB) ==="
        echo "🏗️  Génération AAB avec 'buildozer android release' (requis pour AAB selon doc Kivy)"
        
        # Créer une clé de signature temporaire pour pouvoir générer l'AAB
        echo "🔑 Création clé de signature temporaire pour AAB..."
        keytool -genkey -v -keystore temp.keystore -alias tempkey -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=TempKey, OU=Test, O=Test, L=Test, S=Test, C=FR" \
          -storepass temppass -keypass temppass
        
        # Configurer buildozer avec la clé temporaire
        echo "" >> buildozer.spec
        echo "# Configuration signature temporaire pour génération AAB" >> buildozer.spec
        echo "android.release_keystore = temp.keystore" >> buildozer.spec
        echo "android.release_keystore_passwd = temppass" >> buildozer.spec
        echo "android.release_key = tempkey" >> buildozer.spec
        echo "android.release_key_passwd = temppass" >> buildozer.spec
        
        # Build AAB avec mode release (seule façon de générer AAB selon doc)
        if timeout 1800 buildozer android release --verbose; then
          echo "✅ AAB build successful!"
          ls -la bin/
          
          # Rechercher et copier l'AAB généré
          find bin/ -name "*.aab" | while read aab_file; do
            echo "📱 AAB trouvé: $aab_file"
            cp "$aab_file" "bin/macartedetarot-release.aab"
            echo "✅ AAB copié pour upload: bin/macartedetarot-release.aab"
            
            # Vérifier la signature de l'AAB
            echo "🔍 Vérification signature AAB..."
            jarsigner -verify -verbose "$aab_file" || echo "⚠️  Signature temporaire détectée"
          done
          
          # Aussi copier l'APK s'il existe (pour backup)
          find bin/ -name "*.apk" | head -1 | while read apk_file; do
            echo "📱 APK trouvé: $apk_file"
            cp "$apk_file" "bin/macartedetarot-release.apk"
            echo "✅ APK copié pour backup: bin/macartedetarot-release.apk"
          done
          
        else
          echo "❌ AAB build failed, diagnostic..."
          
          # Diagnostic des erreurs
          echo "=== Diagnostic buildozer ==="
          buildozer android clean || true
          
          # Vérifier les logs buildozer
          if [ -f ".buildozer/logs/buildozer.log" ]; then
            echo "=== Dernières lignes du log buildozer ==="
            tail -50 .buildozer/logs/buildozer.log
          fi
          
          echo "❌ Build complètement échoué"
          exit 1
        fi

    - name: Sign Release AAB (if tagged and keystore available)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        PATH: /usr/lib/jvm/temurin-17-jdk-amd64/bin:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/bin:/bin
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "=== Re-signing Release AAB with Production Key ==="
        
        # Vérifier si nous avons une clé de signature production
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "🔑 Clé de signature production détectée, re-signature de l'AAB..."
          
          # Décoder la clé de signature production
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > production.keystore
          
          # Vérifier que la clé est valide
          echo "🔍 Vérification de la clé de production..."
          keytool -list -keystore production.keystore -storepass "$KEYSTORE_PASSWORD" || {
            echo "❌ Clé de production invalide"
            exit 1
          }
          
          # Re-construire avec la clé de production
          echo "" >> buildozer.spec
          echo "# Configuration signature production pour release" >> buildozer.spec
          echo "android.release_keystore = production.keystore" >> buildozer.spec
          echo "android.release_keystore_passwd = $KEYSTORE_PASSWORD" >> buildozer.spec
          echo "android.release_key = $KEY_ALIAS" >> buildozer.spec
          echo "android.release_key_passwd = $KEY_PASSWORD" >> buildozer.spec
          
          # Nettoyer et re-builder avec la vraie clé
          echo "🧹 Nettoyage pour rebuild avec clé production..."
          rm -f bin/macartedetarot-release.aab
          buildozer android clean
          
          # Build AAB avec clé de production
          if timeout 1800 buildozer android release --verbose; then
            echo "✅ AAB production build successful!"
            ls -la bin/
            
            # Rechercher et copier l'AAB signé avec la clé production
            find bin/ -name "*.aab" | while read aab_file; do
              echo "📱 AAB production trouvé: $aab_file"
              cp "$aab_file" "bin/macartedetarot-production.aab"
              echo "✅ AAB production copié: bin/macartedetarot-production.aab"
              
              # Vérifier la signature de production
              echo "🔍 Vérification signature production..."
              jarsigner -verify -verbose "$aab_file" && echo "✅ AAB correctement signé avec clé production"
            done
          else
            echo "❌ AAB production build failed"
            
            # En cas d'échec, essayer de re-signer l'AAB existant
            if [ -f "bin/macartedetarot-release.aab" ]; then
              echo "🔄 Tentative de re-signature de l'AAB existant..."
              
              # Désigner d'abord
              cp "bin/macartedetarot-release.aab" "bin/unsigned.aab"
              
              # Re-signer avec la clé de production
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore production.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "bin/unsigned.aab" "$KEY_ALIAS"
              
              # Aligner avec zipalign si disponible
              if command -v zipalign >/dev/null 2>&1; then
                zipalign -v 4 "bin/unsigned.aab" "bin/macartedetarot-production.aab"
              else
                cp "bin/unsigned.aab" "bin/macartedetarot-production.aab"
              fi
              
              echo "✅ AAB re-signé manuellement"
            else
              echo "❌ Aucun AAB à re-signer"
              exit 1
            fi
          fi
        else
          echo "⚠️  Pas de clé de signature production configurée"
          echo "❌ ERREUR: Google Play Console nécessite une clé de signature valide"
          echo ""
          echo "📋 Pour publier sur Google Play, il faut OBLIGATOIREMENT :"
          echo "   1. Générer une clé de signature Android:"
          echo "      keytool -genkey -v -keystore release.keystore -alias release"
          echo "      -keyalg RSA -keysize 2048 -validity 10000"
          echo "   2. L'encoder en base64:"
          echo "      base64 -w 0 release.keystore > keystore.base64"
          echo "   3. Ajouter les secrets GitHub:"
          echo "      - ANDROID_KEYSTORE_BASE64 (contenu du fichier keystore.base64)"
          echo "      - KEYSTORE_PASSWORD (mot de passe du keystore)"
          echo "      - KEY_ALIAS (alias de la clé, ex: release)"
          echo "      - KEY_PASSWORD (mot de passe de la clé)"
          echo ""
          echo "⚠️  L'AAB avec clé temporaire sera généré mais ne pourra PAS être publié sur Google Play"
          
          # Copier l'AAB temporaire pour les tests
          if [ -f "bin/macartedetarot-release.aab" ]; then
            cp "bin/macartedetarot-release.aab" "bin/macartedetarot-production.aab"
            echo "📱 AAB temporaire copié (NON VALIDE pour Google Play)"
          fi
        fi
        
    - name: Upload App Bundle (AAB) as artifact
      uses: actions/upload-artifact@v4
      with:
        name: tarot-app-bundle
        path: |
          bin/*.aab
          bin/*.apk
        retention-days: 30
        
    - name: Upload to Google Play Console
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: org.tarot.macartedetarot  # Nom de package cohérent
        releaseFiles: bin/*.aab
        track: internal  # Commence par internal, puis promotion vers production
        status: completed
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          🔮 **Ma Carte de Tarot - Version ${{ github.ref_name }}**
          
          📱 **App Bundle Android disponible**
          - Format AAB optimisé pour Google Play Store
          - Compatible avec toutes les architectures Android
          - Taille optimisée selon votre appareil
          
          ✨ **Nouvelles fonctionnalités :**
          - Interface améliorée
          - Performance optimisée
          - Corrections de bugs
          
          📋 **Installation :**
          - Téléchargez le fichier .aab depuis les artifacts
          - Ou attendez la publication sur Google Play Store
          
          🔮 **Guidance spirituelle authentique avec le Tarot de Marseille !**
        draft: false
        prerelease: false
        
    - name: Upload AAB to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: bin/macartedetarot-production.aab
        asset_name: ma-carte-tarot-${{ github.ref_name }}.aab
        asset_content_type: application/vnd.android.package-archive
