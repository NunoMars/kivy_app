name: Build Android AAB with P4A

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.py'
      - '*.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git unzip zip
        sudo apt install -y libbz2-dev libsqlite3-dev libssl-dev
        sudo apt install -y libffi-dev libncurses5-dev libgdbm-dev
        sudo apt install -y autotools-dev automake autoconf libtool
        sudo apt install -y pkg-config zlib1g-dev libltdl-dev
        sudo apt install -y python3-setuptools python3-wheel
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --user 'cython==0.29.36'
        p4a aab \
          --private . \
          --package=org.tarot.macartedetarot \
          --name="Ma Carte De Tarot" \
          --version=1.4 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,pillow \
          --arch=arm64-v8a \
          --sdk=33 \
          --minsdk=21 \
          --release \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --orientation=portrait        pip install --user pyjnius==1.5.0
        pip install --user python-for-android
        pip install --user buildozer
        pip install --user -r requirements.txt
        echo \"$HOME/.local/bin\" >> $GITHUB_PATH
        
    - name: Set up Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        
        # Télécharger SDK command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        
        # Accepter les licences
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        
        # Installer les composants avec NDK 25 (plus stable)
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" "platform-tools"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
        
        # Ajouter les variables d'environnement pour les étapes suivantes
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
    - name: Build AAB
      run: |
        # Vérifier les variables d'environnement
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        ls -la $ANDROID_HOME/platforms
        
        # Nettoyer complètement l'environnement p4a
        p4a clean_all
        
        # Forcer l'utilisation du NDK 25 et des outils système pour autotools
        export ANDROIDNDK="$ANDROID_NDK_HOME"
        export ACLOCAL_PATH="/usr/share/aclocal"
        export M4PATH="/usr/share/aclocal"
        
        # Compiler l'AAB avec des requirements simplifiés et NDK target compatible
        p4a aab \
          --private . \
          --package=org.tarot.macartedetarot \
          --name="Ma Carte De Tarot" \
          --version=1.4 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,pillow \
          --arch=arm64-v8a \
          --sdk=33 \
          --minsdk=21 \
          --release \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --orientation=portrait
          
    - name: Find and upload AAB
      run: |
        find ~/.local/share/python-for-android -name "*.aab" -exec cp {} ./macartedetarot-1.4.aab \;
        ls -la *.aab
        
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-unsigned
        path: "*.aab"
        
    - name: Sign AAB (if secrets configured)
      if: ${{ env.ANDROID_KEYSTORE != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "$ANDROID_KEYSTORE" | base64 -d > signing.keystore
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore signing.keystore \
          -storepass "$ANDROID_KEYSTORE_PASSWORD" \
          -keypass "$ANDROID_KEY_PASSWORD" \
          macartedetarot-1.4.aab "$ANDROID_KEY_ALIAS"
          
    - name: Upload signed AAB
      if: ${{ env.ANDROID_KEYSTORE != '' }}
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-signed
        path: "*.aab"
