name: Build Android AAB with P4A

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git unzip zip
        sudo apt install -y libbz2-dev libsqlite3-dev libssl-dev
        sudo apt install -y libffi-dev libncurses5-dev libgdbm-dev
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-for-android
        pip install -r requirements.txt
        
    - name: Set up Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        
        # Ajouter les variables d'environnement pour les étapes suivantes
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
    - name: Build AAB
      run: |
        # Vérifier les variables d'environnement
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME
        
        # Nettoyer les builds précédents
        p4a clean_dists
        
        # Compiler l'AAB avec une architecture spécifique
        p4a aab \
          --private . \
          --package=org.tarot.macartedetarot \
          --name="Ma Carte De Tarot" \
          --version=1.4 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,pillow,pyjnius \
          --arch=arm64-v8a \
          --release \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --orientation=portrait
          
    - name: Find and upload AAB
      run: |
        find ~/.local/share/python-for-android -name "*.aab" -exec cp {} ./macartedetarot-1.4.aab \;
        ls -la *.aab
        
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-unsigned
        path: "*.aab"
        
    - name: Sign AAB (if secrets configured)
      if: ${{ env.ANDROID_KEYSTORE != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "$ANDROID_KEYSTORE" | base64 -d > signing.keystore
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore signing.keystore \
          -storepass "$ANDROID_KEYSTORE_PASSWORD" \
          -keypass "$ANDROID_KEY_PASSWORD" \
          macartedetarot-1.4.aab "$ANDROID_KEY_ALIAS"
          
    - name: Upload signed AAB
      if: ${{ env.ANDROID_KEYSTORE != '' }}
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-signed
        path: "*.aab"
