name: Test Build (Simple)

on:
  workflow_dispatch:  # Déclenchement manuel uniquement

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Test Python imports
      run: |
        python -c "import sys; print(f'Python {sys.version}')"
        python -c "import main; print('main.py imports OK')"
        
    - name: Install Kivy dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy pillow
        
    - name: Test app startup
      run: |
        python -c "
        import os
        os.environ['KIVY_GL_BACKEND'] = 'gl'
        import main
        print('App imports successfully')
        "
        
    - name: Validate buildozer.spec
      run: |
        if [ -f buildozer.spec ]; then
          echo '✅ buildozer.spec found'
          grep -E '(title|package|version|requirements)' buildozer.spec
        else
          echo '❌ buildozer.spec missing'
          exit 1
        fi
        
    - name: Check required files
      run: |
        echo "=== Checking app files ==="
        ls -la
        echo "=== Checking images ==="
        ls -la tarot_img/ || echo "No tarot_img directory"
        echo "=== Checking Python files ==="
        find . -name "*.py" -type f
