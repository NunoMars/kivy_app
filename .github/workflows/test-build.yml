name: Test Build (Simple)

on:
  workflow_dispatch:  # Déclenchement manuel uniquement
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - '*.kv'
      - 'requirements.txt'
      - 'buildozer.spec'
      - 'tarot_img/**'
      - '.github/workflows/**'

jobs:
  test-basic:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install basic tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git coreutils
        which git
        which ls
        git --version
        
    - name: Test Python imports
      run: |
        python -c "import sys; print(f'Python {sys.version}')"
        
    - name: Install Kivy dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy pillow
        
    - name: Validate buildozer.spec
      run: |
        if [ -f buildozer.spec ]; then
          echo '✅ buildozer.spec found'
          grep -E '(title|package|version|requirements)' buildozer.spec
        else
          echo '❌ buildozer.spec missing'
          exit 1
        fi
        
    - name: Check required files
      run: |
        echo "=== Checking app files ==="
        /bin/ls -la
        echo "=== Checking images ==="
        if [ -d "tarot_img/" ]; then
          /bin/ls -la tarot_img/
        else
          echo "No tarot_img directory"
        fi
        echo "=== Checking Python files ==="
        find . -name "*.py" -type f
        
  test-buildozer-init:
    runs-on: ubuntu-latest
    needs: test-basic
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip
        pip install buildozer cython
        
    - name: Test buildozer init
      run: |
        # Tester si buildozer peut initialiser
        buildozer --version
        buildozer android clean || echo "Clean failed (normal if first run)"
        
    - name: Check buildozer requirements
      run: |
        echo "=== Buildozer check ==="
        buildozer android check || echo "Check completed with warnings"
