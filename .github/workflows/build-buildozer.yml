name: Build Android AAB with Buildozer (Alternative)

on:
  workflow_dispatch:
    inputs:
      use_buildozer:
        description: 'Utiliser Buildozer au lieu de P4A direct'
        required: false
        default: 'true'

jobs:
  build-with-buildozer:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'  # Java 17 est plus stable avec buildozer
        
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git unzip zip
        sudo apt install -y libbz2-dev libsqlite3-dev libssl-dev
        sudo apt install -y libffi-dev libncurses5-dev libgdbm-dev
        sudo apt install -y autotools-dev automake autoconf libtool
        sudo apt install -y pkg-config zlib1g-dev libltdl-dev
        sudo apt install -y python3-setuptools python3-wheel
        sudo apt install -y ccache
        
    - name: Install Python dependencies for buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36
        pip install -r requirements.txt
        
    - name: Setup Android SDK for Buildozer
      run: |
        # Créer le dossier .buildozer pour forcer le téléchargement
        mkdir -p ~/.buildozer/android/platform
        
        # Buildozer va gérer automatiquement le SDK et NDK
        # Mais on peut pré-configurer l'environnement
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        
    - name: Update buildozer.spec for CI
      run: |
        # Utiliser la configuration CI optimisée
        if [ -f "buildozer-ci.spec" ]; then
          echo "✅ Utilisation de buildozer-ci.spec (optimisé pour CI)"
          cp buildozer-ci.spec buildozer.spec
        else
          echo "⚠️ buildozer-ci.spec non trouvé, modification du buildozer.spec standard"
          # Sauvegarder l'original
          cp buildozer.spec buildozer.spec.backup
          
          # Modifier la config pour la CI
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.api = 34/android.api = 33/' buildozer.spec
          sed -i 's/android.ndk = 25c/android.ndk = 25b/' buildozer.spec
          sed -i 's/android.minapi = 21/android.minapi = 21/' buildozer.spec
        fi
        
        # Vérifier les changements
        echo "=== Configuration buildozer.spec pour CI ==="
        grep -E "(api|ndk|accept_sdk)" buildozer.spec || true
        
    - name: Build APK with Buildozer (test)
      run: |
        # D'abord tester avec APK (plus rapide)
        echo "🧪 Build de test APK..."
        buildozer android debug
        
        # Vérifier que l'APK est créé
        find . -name "*.apk" -type f
        
    - name: Build AAB with Buildozer
      run: |
        echo "🏗️ Build AAB production..."
        
        # Clean pour forcer une build fraîche
        buildozer android clean
        
        # Build AAB
        buildozer android aab
        
        # Vérifier le résultat
        find . -name "*.aab" -type f
        
    - name: Copy and rename AAB
      run: |
        # Trouver et copier l'AAB
        AAB_FILE=$(find . -name "*.aab" -type f | head -1)
        if [ -n "$AAB_FILE" ]; then
          cp "$AAB_FILE" ./macartedetarot-buildozer-1.4.aab
          echo "✅ AAB copié: macartedetarot-buildozer-1.4.aab"
          ls -la *.aab
        else
          echo "❌ Aucun fichier AAB trouvé!"
          exit 1
        fi
        
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-buildozer-unsigned
        path: "*.aab"
        
    - name: Sign AAB (if secrets configured)
      if: ${{ env.ANDROID_KEYSTORE != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "$ANDROID_KEYSTORE" | base64 -d > signing.keystore
        
        # Signer l'AAB avec jarsigner
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore signing.keystore \
          -storepass "$ANDROID_KEYSTORE_PASSWORD" \
          -keypass "$ANDROID_KEY_PASSWORD" \
          macartedetarot-buildozer-1.4.aab "$ANDROID_KEY_ALIAS"
          
        echo "✅ AAB signé avec succès"
        
    - name: Upload signed AAB
      if: ${{ env.ANDROID_KEYSTORE != '' }}
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      uses: actions/upload-artifact@v4
      with:
        name: android-aab-buildozer-signed
        path: "*.aab"
        
    - name: Build Summary
      run: |
        echo "## 🏗️ Build Buildozer Complète" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Résultats:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ AAB généré avec Buildozer" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Compatibilité NDK gérée automatiquement" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Configuration optimisée pour CI/CD" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Fichiers générés:" >> $GITHUB_STEP_SUMMARY
        ls -la *.aab >> $GITHUB_STEP_SUMMARY || echo "Aucun AAB trouvé" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎯 **AAB prêt pour Google Play Store!**" >> $GITHUB_STEP_SUMMARY
